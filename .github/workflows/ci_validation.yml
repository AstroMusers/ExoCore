name: CI validation

on:
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Validate notebook integrity
        run: python scripts/validate_notebooks.py
      - uses: conda-incubator/setup-miniconda@v3  # https://github.com/marketplace/actions/setup-miniconda
        with:
          activate-environment: exocore
          environment-file: environment.yml
          python-version: 3.12
          auto-activate-base: false
      - name: Register ExoCore kernel
        run: python -m ipykernel install --user --name exocore-ci --display-name "ExoCore CI"
      - name: Gather changed notebooks
        id: changed-files
        uses: tj-actions/changed-files@v44.5.2
        with:
          files: |
            **/*.ipynb
      - name: Execute changed notebooks
        run: |
          for file in ${{ steps.changed-files.outputs.added_files }} ${{ steps.changed-files.outputs.modified_files }}; do
            echo "$file was updated, executing notebook"
            jupyter nbconvert --template classic --to html --execute \
              --ExecutePreprocessor.kernel_name=exocore-ci "$file"
          done
