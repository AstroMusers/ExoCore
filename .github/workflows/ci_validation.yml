name: CI validation

on:
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
      - name: Validate notebook integrity
        run: python scripts/validate_notebooks.py
      - uses: conda-incubator/setup-miniconda@v4  # https://github.com/marketplace/actions/setup-miniconda
        with:
          activate-environment: exocore
          environment-file: environment.yml
          python-version: 3.12
          auto-activate: false
      - name: Register ExoCore kernel
        run: python -m ipykernel install --user --name exocore-ci --display-name "ExoCore CI"
      - name: Gather changed notebooks
        id: changed-files
        uses: tj-actions/changed-files@v47.0.6
        with:
          json: true
          files: |
            **/*.ipynb
      - name: Execute changed notebooks
        env:
          ADDED_NOTEBOOKS: ${{ steps.changed-files.outputs.added_files }}
          MODIFIED_NOTEBOOKS: ${{ steps.changed-files.outputs.modified_files }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          notebooks = json.loads(os.environ["ADDED_NOTEBOOKS"]) + json.loads(
              os.environ["MODIFIED_NOTEBOOKS"]
          )
          if not isinstance(notebooks, list) or any(not isinstance(path, str) for path in notebooks):
              raise ValueError("Changed notebook paths must be JSON strings")
          for notebook in sorted(set(notebooks)):
              print(f"{notebook} was updated, executing notebook")
              subprocess.run(
                  [sys.executable, "-m", "nbconvert", "--template", "classic",
                   "--to", "html", "--execute", "--ExecutePreprocessor.kernel_name=exocore-ci",
                   notebook],
                  check=True,
              )
          PY
