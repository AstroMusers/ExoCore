name: exocore
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - astropy=7.2.0
  - astroquery=0.4.11
  - jupyter
  - nbconvert
  - numpy<2
  - pandas<3
  - scipy=1.16.3
  - libgfortran5>=14  # older builds have a duplicate LC_RPATH that recent macOS refuses to load
  - pip
  - pip:
    - lightkurve==2.5.1
    - jupyterquiz==2.9.6.4
    - rebound==4.6.0
    - tdpy @ git+https://github.com/tansudaylan/tdpy.git@35df1703c6b63d6a62f7d44b12cf5928b5d355ed
